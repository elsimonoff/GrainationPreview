# Keeps the site up to date:
#  1. every hour, asks graination.ca which 35mm films are in stock
#  2. saves the list to data/films.json (only commits when something changed)
#  3. publishes the site with GitHub Pages
name: Update stock and publish site

on:
  schedule:
    - cron: '17 * * * *' # every hour, at minute 17
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:

permissions:
  contents: write # to commit the refreshed stock list
  pages: write # to publish the site
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch in-stock 35mm films from Graination
        run: node scripts/fetch-stock.mjs

      - name: Refresh list of Wikimedia Commons film categories (at most daily)
        run: node scripts/fetch-commons-categories.mjs
        env:
          COMMONS_CONTACT: ${{ vars.COMMONS_CONTACT }}
        continue-on-error: true

      - name: Collect sample photos for each film (each refreshed weekly)
        run: node scripts/fetch-photos.mjs
        env:
          COMMONS_CONTACT: ${{ vars.COMMONS_CONTACT }}
        continue-on-error: true

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update 35mm stock list"
            git push
          fi

      - name: Stamp file versions so browsers load the newest code
        if: github.ref_name == github.event.repository.default_branch
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s#assets/app.js\"#assets/app.js?v=$v\"#; s#assets/styles.css\"#assets/styles.css?v=$v\"#" index.html
          sed -i -E "s#from '\./([a-z-]+)\.js'#from './\1.js?v=$v'#g" assets/*.js
          grep -h "?v=" index.html assets/app.js | head -3

      - name: Package site
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: update
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
